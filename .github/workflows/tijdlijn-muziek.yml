name: Tijdlijn – muziekdatabase bouwen

# Haalt muziekkaarten per genre uit Wikidata en controleert bij Apple of er een fragment is.
# Draait als het bouwscript verandert, of met de hand via "Run workflow".
on:
  push:
    paths:
      - "tijdlijnspel/tools/bouw-muziek.mjs"
      - ".github/workflows/tijdlijn-muziek.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tijdlijn-muziek-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controle:
    name: Snelle controle (alleen Wikidata)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tijdlijnspel/tools/bouw-muziek.mjs --alleen-wikidata

  bouw:
    name: Database bouwen
    needs: controle
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tijdlijnspel/tools/bouw-muziek.mjs
      - name: Resultaat opslaan in de branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tijdlijnspel/js/muziek-db.js tijdlijnspel/tools/itunes-cache.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Niets veranderd"; exit 0; fi
          git commit -m "Tijdlijn: muziekdatabase bijgewerkt uit Wikidata"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
