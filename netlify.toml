# Netlify-instellingen voor het spel Tijdlijn (de boodschappenapp zelf draait op Vercel).
# Bij koppelen in Netlify hoeft niets ingevuld te worden: alles staat hier.
[build]
  base = "tijdlijnspel"   # map met het spel
  publish = "."           # ten opzichte van base: de map zelf
  command = ""            # geen build-stap nodig

# De service worker altijd vers ophalen, zodat updates direct doorkomen.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
